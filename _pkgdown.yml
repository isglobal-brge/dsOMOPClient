      href: articles/book-00-start.html
    book:
      text: Tutorial chapters
      menu:
        - text: 0. Getting started
          href: articles/book-00-start.html
        - text: 1. DataSHIELD and OMOP
          href: articles/book-01-mental-model.html
        - text: 2. Connecting
          href: articles/book-02-connect.html
        - text: 3. Exploring the CDM
          href: articles/book-03-explore.html
        - text: 4. Vocabulary
          href: articles/book-04-vocabulary.html
        - text: 5. A first recipe
          href: articles/book-05-recipe.html
        - text: 6. Events, windows and reducers
          href: articles/book-06-events.html
        - text: 7. Populations
          href: articles/book-07-populations.html
        - text: 8. Output formats
          href: articles/book-08-outputs.html
        - text: 9. Dates
          href: articles/book-09-dates.html
        - text: 10. Concepts as categories
          href: articles/book-08-harmonise.html
        - text: 11. Reusable studies and verbs
          href: articles/book-11-parameters.html
        - text: 12. Privacy
          href: articles/book-12-privacy.html
        - text: 13. Visit walkthrough
          href: articles/book-06-visits.html
        - text: 14. Verbal-autopsy capstone
