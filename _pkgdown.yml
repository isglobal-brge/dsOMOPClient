  bslib:
    primary: '#003142'
    secondary: '#337ab7'
    warning: '#f19119'
    bg: '#ffffff'
    fg: '#233746'
    base_font: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif'
