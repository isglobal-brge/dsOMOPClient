url: https://isglobal-brge.github.io/dsOMOPClient/
template:
  bootstrap: 5
  bslib:
    primary: '#005b8f'
    secondary: '#5c6f7b'
    success: '#4c9a2a'
    bg: '#ffffff'
    fg: '#233746'
    base_font: 'Source Sans 3, Source Sans Pro, Arial, sans-serif'
    heading_font: 'Source Sans 3, Source Sans Pro, Arial, sans-serif'
    code_font: 'ui-monospace, SFMono-Regular, Menlo, monospace'
    font-size-base: 1.05rem
    border-radius: 0.3rem
home:
  title: Learn dsOMOPClient
  description: A practical DataSHIELD and OMOP book with executed examples for 2.10.4.
navbar:
