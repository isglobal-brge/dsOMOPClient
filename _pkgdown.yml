url: https://isglobal-brge.github.io/dsOMOPClient/
template:
  bootstrap: 5
  bslib:
    primary: '#003142'
    secondary: '#337ab7'
    warning: '#f19119'
    bg: '#ffffff'
    fg: '#233746'
    base_font: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif'
    heading_font: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif'
    code_font: 'ui-monospace, SFMono-Regular, Menlo, monospace'
